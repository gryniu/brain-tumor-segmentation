# NVIDIA GPU training. Check peak memory with scripts/smoke_test.py first and adjust patch_size /
# model.features if needed (docs/reference.md, "Choosing settings for your hardware").
_base_: default.yaml

data:
  num_workers: 4             # Colab free tier has 2 vCPUs: use 2 there
  cache: none

model:
  features: [32, 64, 128, 256, 320]   # 16.6M params; use default.yaml features on small GPUs

train:
  device: cuda
  epochs: 300
  batch_size: 1
  samples_per_volume: 2      # 2 patches per loaded volume
  patch_size: [128, 128, 128]
  amp: true
  amp_dtype: float16         # bfloat16 on Ampere or newer (A100, L4, RTX 30xx+); no GradScaler needed
  val_interval: 5
  log_interval: 100
  max_hours: null            # e.g. --set train.max_hours=8

inference:
  overlap: 0.5
  sw_batch_size: 4
  stitch_on_cpu: false       # true if full-volume validation runs out of GPU memory
