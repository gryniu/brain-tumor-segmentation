# Short REAL-data pilot (run this on the real BraTS download BEFORE renting a GPU for the full run).
# Purpose: confirm that the loss decreases and that validation Dice is computed from real MRI and
# real masks, on a small slice of the training/validation subsets of the same patient-level split
# used by the full run (the test subset is untouched). Pilot metrics are NOT results.
_base_: local_mps.yaml

train:
  epochs: 12
  val_interval: 2
  limit_train_cases: 40
  limit_val_cases: 10
  train_eval_cases: 2
  early_stopping_patience: null
  warmup_epochs: 1
  log_interval: 10
