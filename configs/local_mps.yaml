# Development and small experiments on an Apple Silicon Mac (16 GB unified memory).
# Same model and patch size as default.yaml, so local runs stay comparable with default.yaml
# runs; only throughput-related settings (validation subset, overlap) change.
#
# Measured on an Apple M4 Mac (PyTorch 2.15, float32): one training step with
# this model and a 96^3 patch takes ~0.9 s and ~2.2 GB of MPS memory.
_base_: default.yaml

data:
  num_workers: 2             # macOS uses "spawn" workers; more than 2-4 rarely helps
  cache: none                # BraTS does not fit in 16 GB RAM; stream from disk

train:
  device: auto               # resolves to mps on Apple Silicon
  epochs: 100
  val_interval: 5
  limit_val_cases: 40        # validate on the first 40 validation cases to save time
  train_eval_cases: 2
  log_interval: 50

inference:
  overlap: 0.25              # fewer sliding windows for faster validation; evaluate.py uses this too
