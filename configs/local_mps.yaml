# Apple Silicon (16 GB). Same model and patch as default.yaml; measured on an M4: ~0.9 s and ~2.2 GB per step.
_base_: default.yaml

data:
  num_workers: 2             # macOS uses "spawn" workers; more than 2-4 rarely helps
  cache: none                # BraTS does not fit in 16 GB RAM; stream from disk

train:
  device: auto               # resolves to mps on Apple Silicon
  epochs: 100
  val_interval: 5
  limit_val_cases: 40        # validate on the first 40 validation cases to save time
  train_eval_cases: 2
  log_interval: 50

inference:
  overlap: 0.25              # fewer sliding windows for faster validation; evaluate.py uses this too
