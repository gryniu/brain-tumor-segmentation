# Free Colab T4 (2 vCPU, 15 GB), about one hour: 250 of 874 training cases, compact cache, time cap.
# Epoch 1 builds the cache and is slow (~490 s measured); later epochs took ~78 s.
_base_: cloud_cuda.yaml

data:
  cache: npy
  cache_dir: /content/cache  # local disk, not Google Drive
  num_workers: 2             # Colab has 2 vCPUs

model:
  features: [16, 32, 64, 128, 256]   # 5.65M parameters

train:
  patch_size: [96, 96, 96]
  samples_per_volume: 2
  epochs: 20
  val_interval: 5
  limit_train_cases: 250
  limit_val_cases: 20
  train_eval_cases: 2
  early_stopping_patience: null
  warmup_epochs: 1
  max_hours: 0.65
